[project]
name = "procurerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.2.3",
    "fastapi>=0.143.1",
    "langchain>=1.4.0",
    "langchain-community<0.4",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.11",
    "langsmith>=0.12.5",
    "mcp>=2.3.0,<3",
    "numpy>=2.4.6",
    "openai>=3.13.0",
    "pillow>=12.3.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.3",
    "ragas>=0.3.1",
    "sentence-transformers>=6.0.1",
    # Not imported by ProcureRAG itself (sentence-transformers needs it), but
    # listed here on purpose: `[tool.uv.sources]` below only applies to
    # DIRECT dependencies. Left out, uv silently ignores the CPU-only source,
    # and Linux gets the CUDA build again (checked on 2026-10-15). Pinned
    # with `==` so the Linux CPU build stays the same version as the macOS
    # build (unpinned, uv picked 2.14.1+cpu for Linux only). Bump it on purpose.
    "torch==2.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
    "pytest>=9.1.1",
    "ruff>=0.14.4",
]

# Ruff ships with hundreds of optional rule plugins beyond its core checks;
# without pinning `select` explicitly, `ruff check` on a fresh install can
# enable far more of them than a small learning repo wants (opinionated
# style rules like forced import sorting/parenthesization across every past
# day's file, unrelated to anything Day 10 touched). Pinning to the
# well-known "default" set - E4/E7/E9 (pycodestyle errors: syntax issues,
# bad indentation, etc.) and F (pyflakes: unused imports/names, undefined
# names, etc.) - is the conventional minimal lint gate: real correctness
# bugs, not style opinions. `./.venv/bin/python -m ruff check src tests`
# passes cleanly against this selection today.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# CPU-only PyTorch on Linux (Day 22). On Linux, PyPI's `torch` wheel is the
# CUDA build: together with Triton, its NVIDIA libraries (cuDNN, cuBLAS,
# NCCL, ...) took 4.2 GB, 67% of the Docker image's environment. ProcureRAG
# runs its two small models on CPU only, in the container and on Azure, so
# none of that GPU code is ever loaded. PyTorch publishes CPU-only builds on
# its own package index (versions end in `+cpu`), and this sends `torch` there.
#
# - `marker = "sys_platform == 'linux'"`: only Linux changes. On macOS,
#   PyPI's wheel has no CUDA libraries anyway, so the local `.venv` keeps
#   exactly the `torch` it had.
# - `explicit = true`: uv uses this index ONLY for packages that name it
#   here. Every other package still comes from PyPI, so the PyTorch index
#   cannot quietly replace them.
#
# This is the pattern from uv's "Using uv with PyTorch" guide.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
